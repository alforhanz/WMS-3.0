<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Picking - WMS</title>

  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

  <!-- Materialize Base + CSS Maestro Unificado -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/main.css?v=4.2" media="screen,projection" />

  <link rel="icon" type="image/x-icon" href="/img/wms.ico" />
  <script src="js/encabezado.js" type="text/javascript"></script>
</head>

<body id="home" tabindex="-1">
  <!-- HEADER -->
  <my-header></my-header>

  <main>
    <!-- Modal Loader del sistema unificado -->
    <div id="contenedorLoader"></div>

    <div class="vista-wrapper">

      <!-- Botón Volver Superior -->
      <div class="top-action-bar">
        <button type="button" class="btn btn-volver" onclick="volverAtras(event)">
          <i class="material-icons">arrow_back</i>
          <span>Volver</span>
        </button>
      </div>

      <!-- Título de la Vista -->
      <h1 class="titulo-principal">PREPARACIÓN Y PICKING DE PEDIDOS</h1>

      <!-- PANEL: DATOS BÁSICOS -->
      <div id="tabContentDatosBasicos" class="tab-pane active">
        <div class="datos-basicos-flex">

          <div class="filter-box filter-box-left" style="flex: 1 1 100%;">
            <span class="box-title-legend">Criterios de Búsqueda de Picking</span>

            <div class="filter-grid-left">

              <!-- Número de Pedido -->
              <div class="input-group-custom">
                <label for="pPedido" class="input-label-custom">Número de Pedido</label>
                <input type="text" id="pPedido" class="custom-text-input" placeholder="Ingrese N° de pedido"
                  autocomplete="off">
              </div>

              <!-- Fecha Inicial -->
              <div class="input-group-custom">
                <label for="fecha_ini" class="input-label-custom">Fecha Inicial</label>
                <div class="input-with-icon">
                  <input type="text" id="fecha_ini" class="datepicker custom-text-input" placeholder="yyyy-mm-dd">
                  <i class="material-icons input-calendar-icon">event</i>
                </div>
              </div>

              <!-- Fecha Final -->
              <div class="input-group-custom">
                <label for="fecha_fin" class="input-label-custom">Fecha Final</label>
                <div class="input-with-icon">
                  <input type="text" id="fecha_fin" class="datepicker custom-text-input" placeholder="yyyy-mm-dd">
                  <i class="material-icons input-calendar-icon">event</i>
                </div>
              </div>

              <!-- Switch: Pedidos Preparados (EPK vs FPK) -->
              <div class="input-group-custom" style="justify-content: center; padding-top: 10px;">
                <label class="clasif-toggle-wrapper">
                  <input type="checkbox" id="toggleSwitch" checked="false">
                  <span class="onoff-switch"><span class="onoff-slider"></span></span>
                  <span class="toggle-label-text">Pedidos Preparados</span>
                </label>
              </div>

            </div>
          </div>

        </div>
      </div>

      <!-- BOTÓN BUSCAR -->
      <div class="search-action-container">
        <button id="btnBuscar" class="btn-buscar-gradient" type="button" onclick="validarFormulario()">
          <span>Mostrar Pedidos</span>
          <i class="material-icons">send</i>
        </button>
      </div>

      <!-- BARRA DE RESULTADOS -->
      <div class="results-control-bar">
        <div id="resultadoGeneral" class="total-registros-title">
          <!-- Aquí se inyecta dinámicamente: Total de Registros: X -->
        </div>
      </div>

      <!-- GRID DE RESULTADOS -->
      <div class="grid-table-responsive">
        <table id="tblpedido" class="tabla-transacciones">
          <thead>
            <tr>
              <th style="width: 15%;">Documento</th>
              <th style="width: 40%; text-align: left;">Descripción / Cliente</th>
              <th style="width: 15%;">cant. <br> Pedida.</th>
              <th style="width: 15%;">Cant. <br> Prep.</th>
              <th style="width: 15%;">Verificado</th>
            </tr>
          </thead>
          <tbody>
            <!-- Filas inyectadas por js/verificacionDePicking.js -->
          </tbody>
        </table>
      </div>

      <!-- PAGINADOR -->
      <div id="resultadoPaginador" class="paginador-custom"></div>

    </div>
  </main>

  <!-- FOOTER -->
  <my-footer></my-footer>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="text/javascript" src="js/environment.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/main.js?v=4.3" defer></script>
  <script type="text/javascript" src="js/menu.js?v=4.2" defer></script>
  <!-- Lógica y Paginación -->
  <script type="text/javascript" src="js/paginacion.js?v=4.2"></script>
  <script type="text/javascript" src="js/loader.js?v=4.2"></script>
  <script type="text/javascript" src="js/footer.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/verificacionDePicking.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/version-checker.js?v=4.2"></script>
</body>

</html>
