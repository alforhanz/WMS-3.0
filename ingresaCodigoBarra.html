<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar Códigos de Barra - WMS</title>

  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

  <!-- Materialize Base + CSS Maestro Unificado -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/main.css?v=4.2" media="screen,projection" />

  <link rel="icon" type="image/x-icon" href="/img/wms.ico" />
  <script src="js/encabezado.js" type="text/javascript"></script>

  <style>
    .form-card-container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .form-grid-two-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 15px;
    }

    /* Contenedor inferior: Botón a la izquierda y Switch a la derecha */
    .form-actions-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .form-actions-bottom-row .btn-buscar-gradient {
      max-width: 250px;
      margin: 0 !important;
    }

    .toggle-inline-wrapper {
      display: flex;
      align-items: center;
    }

    @media screen and (max-width: 639px) {
      .form-grid-two-cols {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .form-actions-bottom-row {
        flex-direction: column-reverse;
        align-items: center;
        gap: 16px;
      }

      .form-actions-bottom-row .btn-buscar-gradient {
        max-width: 100%;
        width: 100%;
      }
    }
  </style>
</head>

<body id="home" tabindex="-1">
  <!-- HEADER -->
  <my-header></my-header>

  <main>
    <!-- Modal Loader Global -->
    <div id="contenedorLoader"></div>

    <div class="vista-wrapper">

      <!-- Barra Superior de Acciones -->
      <div class="top-action-bar">
        <button type="button" class="btn btn-volver" onclick="window.history.back()">
          <i class="material-icons">arrow_back</i>
          <span>Volver</span>
        </button>
      </div>

      <!-- Título de la Vista -->
      <h1 class="titulo-principal">REGISTRO DE CÓDIGO DE BARRAS</h1>

      <!-- CONTENEDOR DEL FORMULARIO -->
      <div class="form-card-container">
        <div class="filter-box">
          <span class="box-title-legend">Datos del Artículo y Código</span>

          <!-- Campos del Formulario -->
          <div class="form-grid-two-cols">
            
            <!-- Código de Artículo -->
            <div class="input-group-custom">
              <label for="pArticulo" class="input-label-custom">Código de Artículo</label>
              <div class="input-with-icon">
                <input id="pArticulo" type="text" class="custom-text-input" placeholder="Ingrese o pistolee artículo..." autocomplete="off">
                <i class="material-icons input-calendar-icon">inventory_2</i>
              </div>
            </div>

            <!-- Códigos de Barra Asociados -->
            <div class="input-group-custom">
              <label for="selectBarcodes" class="input-label-custom">Códigos Asociados Existentes</label>
              <select id="selectBarcodes" class="browser-default custom-text-input" style="cursor: pointer; height: 38px;">
                <option value="" disabled selected>Seleccione un código</option>
              </select>
            </div>

            <!-- Nuevo Código de Barra -->
            <div class="input-group-custom">
              <label for="pCodigoBarra" class="input-label-custom">Nuevo Código de Barra</label>
              <div class="input-with-icon">
                <input id="pCodigoBarra" type="text" class="custom-text-input" placeholder="Pistolee nuevo código de barra..." autocomplete="off">
                <i class="material-icons input-calendar-icon">qr_code_scanner</i>
              </div>
            </div>

            <!-- Clave de Autorización -->
            <div class="input-group-custom">
              <label for="autorizacion" class="input-label-custom">Clave de Autorización</label>
              <div class="input-with-icon">
                <input id="autorizacion" type="password" class="custom-text-input" placeholder="Clave de supervisor..." autocomplete="new-password">
                <i class="material-icons input-calendar-icon">lock</i>
              </div>
            </div>

          </div>

          <!-- Fila Inferior: Botón de Registro y Switch de Modo al lado -->
          <div class="form-actions-bottom-row">
            
            <!-- Botón de Registro -->
            <button id="btnCodBarras" class="btn-buscar-gradient" type="button" onclick="InsertaCodigoBarra()">
              <span>Registrar Código</span>
              <i class="material-icons right">save</i>
            </button>

            <!-- Switch de Modo -->
            <div class="toggle-inline-wrapper">
              <label class="clasif-toggle-wrapper">
                <span class="toggle-label-text">Artículo Individual</span>
                <input type="checkbox" id="arti_Kit">
                <span class="onoff-switch"><span class="onoff-slider"></span></span>
                <span class="toggle-label-text">Kit o Caja</span>
              </label>
            </div>

          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <my-footer></my-footer>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="text/javascript" src="js/environment.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/main.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/menu.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/loader.js?v=4.2"></script>
  <script type="text/javascript" src="js/footer.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/version-checker.js?v=4.2"></script>

  <script type="text/javascript" src="js/ingresaCodigoBarras.js?v=4.2" defer></script>
</body>

</html>
