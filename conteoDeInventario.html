<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conteo de Inventario - WMS</title>

  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

  <!-- Materialize Base + CSS Maestro Unificado -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/main.css?v=4.2" media="screen,projection" />

  <link rel="icon" type="image/x-icon" href="/img/wms.ico" />
  <script src="js/encabezadoconteoinvent.js" type="text/javascript"></script>

  <style>
    .codigo-barras-input {
      width: 100% !important;
      height: 32px !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 4px !important;
      text-align: center;
      font-size: 13px !important;
      margin: 0 !important;
      background-color: #f8fafc !important;
    }

    .codigo-barras-input:focus {
      border-color: var(--primary-teal) !important;
      box-shadow: 0 0 0 2px rgba(27, 103, 107, 0.2) !important;
    }

    .observaciones-caja {
      width: 100%;
      min-height: 60px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: #1e293b;
      resize: vertical;
      box-sizing: border-box;
      margin-top: 6px;
    }

    .action-buttons-wrapper {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-action-item {
      min-width: 200px !important;
      width: auto !important;
      box-shadow: none !important;
      padding: 0 20px !important;
    }

    .btn-export-group {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .btn-export-pill {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 20px;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: #1e293b;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .btn-export-pill:hover {
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .btn-export-pill img {
      width: 16px;
      height: 16px;
    }

    @media screen and (max-width: 639px) {
      .action-buttons-wrapper {
        flex-direction: column;
      }

      .btn-action-item {
        width: 100% !important;
      }

      .btn-export-group {
        justify-content: center;
      }

      .tabla-compacta-movil th,
      .tabla-compacta-movil td {
        padding: 6px 4px !important;
        font-size: 10px !important;
      }
    }
  </style>
</head>

<body id="home" tabindex="-1">
  <!-- HEADER -->
  <my-header></my-header>

  <main>
    <!-- Modal Loader Global -->
    <div id="contenedorLoader"></div>

    <div class="vista-wrapper">

      <!-- Barra Superior de Acciones -->
      <div class="top-action-bar">
        <button type="button" class="btn btn-volver" onclick="volverAtras(event)">
          <i class="material-icons">arrow_back</i>
          <span>Volver</span>
        </button>
      </div>

      <!-- Título de la Vista -->
      <h1 class="titulo-principal">CONTEO DE INVENTARIO FÍSICO</h1>

      <!-- PANEL: FILTROS / DATOS BÁSICOS -->
      <div id="tabContentDatosBasicos" class="tab-pane active">
        <div class="datos-basicos-flex">
          <div class="filter-box filter-box-left" style="flex: 1 1 100%;">
            <span class="box-title-legend">Parámetros del Inventario</span>

            <div class="filter-grid-left">

              <!-- Fecha Programada -->
              <div class="input-group-custom">
                <label for="fecha_ini" class="input-label-custom">Fecha de Inventario</label>
                <select id="fecha_ini" class="browser-default custom-text-input" style="cursor: pointer;">
                  <option value="" disabled selected>Cargando fechas...</option>
                </select>
              </div>

              <!-- Ubicación -->
              <div class="input-group-custom">
                <label for="ubicacion" class="input-label-custom">Ubicación / Estante</label>
                <input id="ubicacion" type="text" class="custom-text-input" placeholder="Ej: PASILLO-01, EST-A"
                  autocomplete="off">
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Navegación de Pestañas Modernas -->
      <div class="custom-tabs-nav">
        <button type="button" id="btnTabLectura" class="custom-tab-btn active" onclick="cambiarPestanaLocal('lectura')">
          LECTURA
        </button>
        <button type="button" id="btnTabResumen" class="custom-tab-btn" onclick="cambiarPestanaLocal('resumen')">
          RESUMEN
        </button>
      </div>

      <script>
        function cambiarPestanaLocal(tabName) {
          const btnLec = document.getElementById("btnTabLectura");
          const btnRes = document.getElementById("btnTabResumen");
          const paneLec = document.getElementById("tabContentLectura");
          const paneRes = document.getElementById("tabContentResumen");

          if (tabName === "lectura") {
            btnLec.classList.add("active");
            btnRes.classList.remove("active");
            paneLec.classList.add("active");
            paneRes.classList.remove("active");
            activabtnguardar();
          } else if (tabName === "resumen") {
            btnRes.classList.add("active");
            btnLec.classList.remove("active");
            paneRes.classList.add("active");
            paneLec.classList.remove("active");
            resumen();
          }
        }
      </script>

      <!-- ==========================================
           TABLA 1: LECTURA
      =============================================== -->
      <div id="tabContentLectura" class="tab-pane active">
        <div class="grid-table-responsive">
          <table id="myTableLectura" class="tabla-transacciones">
            <thead>
              <tr>
                <th style="width: 35%; text-align: left;">Artículo</th>
                <th style="width: 35%;">Código de Barras</th>
                <th style="width: 20%;">Cant.</th>
                <th style="width: 10%;">Acción</th>
              </tr>
            </thead>
            <tbody id="tblbodyLectura">
              <tr>
                <td class="cell-center">
                  <span style="font-weight: 600; color: #1e293b;"></span>
                </td>
                <td>
                  <input id="codigo-barras" type="text" class="codigo-barras-input" value=""
                    onchange="validarCodigoBarras(this)" autofocus autocomplete="off">
                </td>
                <td>
                  <input id="cant-leida" type="text" class="codigo-barras-input" value=""
                    onchange="validarCantidades(this)" autocomplete="off">
                </td>
                <td class="cell-center">
                  <i class="material-icons" style="cursor: pointer; color: #ef4444; font-size: 20px;"
                    onclick="eliminarFila(this)">delete</i>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Acciones en Lectura -->
        <div class="action-buttons-wrapper">
          <button id="btnGuardaConteo" class="btn-buscar-gradient btn-action-item" type="button"
            onclick="confirmarGuardadoParcialLectura()">
            <span>Guardar Conteo</span>
            <i class="material-icons right">save</i>
          </button>
        </div>
      </div>

      <!-- ==========================================
           TABLA 2: RESUMEN
      =============================================== -->
      <div id="tabContentResumen" class="tab-pane">

        <!-- Barra de Controles y Descargas -->
        <div class="results-control-bar" style="margin-top: 5px; flex-wrap: wrap; gap: 10px;">
          <div class="total-registros-title" id="cantidadDeRegistros">
            Cantidad de registros: 0
          </div>

          <div class="btn-export-group">
            <button id="btnDescargarExcel" class="btn-export-pill" type="button" onclick="resumen_descargarExcel()"
              hidden>
              <img src="img/excel.png" alt="Excel">
              <span>Descargar Excel</span>
            </button>
            <button id="btnDescargarPDF" class="btn-export-pill" type="button" onclick="resumen_descargarPDF()" hidden>
              <img src="img/pdf.png" alt="PDF">
              <span>Descargar PDF</span>
            </button>
          </div>
        </div>

        <div class="grid-table-responsive">
          <table id="myTableresumen" class="tabla-transacciones tabla-compacta-movil">
            <thead>
              <!-- Inyectado dinámicamente por conteoDeInventario.js -->
            </thead>
            <tbody id="tblbodyRersumen">
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>

        <!-- Paginador Estándar -->
        <div id="pagination"></div>

        <!-- Acciones en Resumen -->
        <div class="action-buttons-wrapper">
          <button id="btnFinalizar" class="btn-buscar-gradient btn-action-item"
            style="background: #0284c7; box-shadow: none;" type="button" onclick="confirmaFinalizar()" hidden>
            <span>Finalizar Inventario</span>
            <i class="material-icons right">check_circle</i>
          </button>
        </div>
      </div>

      <!-- Observaciones -->
      <div id="observaciones-container" style="margin-top: 20px;">
        <label for="observaciones" class="input-label-custom">Observaciones del Conteo</label>
        <textarea placeholder="Ingrese notas adicionales del conteo..." id="observaciones"
          class="observaciones-caja"></textarea>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <my-footer></my-footer>

  <!-- Bibliotecas Excel y PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <!-- Scripts Globales -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="text/javascript" src="js/environment.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/main.js?v=4.3" defer></script>
  <script type="text/javascript" src="js/menu.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/paginacion.js?v=4.2"></script>
  <script type="text/javascript" src="js/loader.js?v=4.2"></script>
  <script type="text/javascript" src="js/footer.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/version-checker.js?v=4.2"></script>

  <script type="text/javascript" src="js/conteoDeInventario.js?v=4.2" defer></script>
</body>

</html>
