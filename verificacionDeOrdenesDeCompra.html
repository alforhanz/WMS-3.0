<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Órdenes de Compra - WMS</title>

  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

  <!-- Materialize Base + CSS Maestro Unificado -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/main.css?v=4.2" media="screen,projection" />

  <link rel="icon" type="image/x-icon" href="/img/wms.ico" />
  <script src="js/encabezado.js" type="text/javascript"></script>

  <style>
    /* ========================================================
       AJUSTES ULTRA-COMPACTOS PARA MÓVILES (5 COLUMNAS VISIBLES)
       ======================================================== */
    @media screen and (max-width: 639px) {
      .grid-table-responsive {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      #tblordendecompra {
        width: 100% !important;
        table-layout: fixed !important;
      }

      #tblordendecompra th,
      #tblordendecompra td {
        padding: 5px 2px !important;
        font-size: 9.5px !important;
        line-height: 1.15 !important;
        word-break: break-word;
      }

      /* Distribución calculada exacta para 100% en pantallas móviles */
      #tblordendecompra thead th:nth-child(1),
      #tblordendecompra tbody td:nth-child(1) {
        width: 28% !important;
      }

      /* Orden / Emb. */
      #tblordendecompra thead th:nth-child(2),
      #tblordendecompra tbody td:nth-child(2) {
        width: 12% !important;
      }

      /* Destino */
      #tblordendecompra thead th:nth-child(3),
      #tblordendecompra tbody td:nth-child(3) {
        width: 34% !important;
      }

      /* Proveedor */
      #tblordendecompra thead th:nth-child(4),
      #tblordendecompra tbody td:nth-child(4) {
        width: 13% !important;
      }

      /* Sol. */
      #tblordendecompra thead th:nth-child(5),
      #tblordendecompra tbody td:nth-child(5) {
        width: 13% !important;
      }

      /* Ver. */

      .cell-articulo-box .cell-articulo-code {
        font-size: 10px !important;
        font-weight: 700;
        line-height: 1.1;
      }

      .cell-articulo-box span {
        font-size: 8.5px !important;
        line-height: 1.1;
      }

      .txt-th-desktop {
        display: none;
      }

      .txt-th-movil {
        display: inline;
      }
    }

    @media screen and (min-width: 640px) {
      .txt-th-movil {
        display: none;
      }

      .txt-th-desktop {
        display: inline;
      }
    }
  </style>
</head>

<body id="home" tabindex="-1">
  <!-- HEADER -->
  <my-header></my-header>

  <main>
    <!-- Modal Loader Global -->
    <div id="contenedorLoader"></div>

    <div class="vista-wrapper">

      <!-- Barra Superior de Acciones -->
      <div class="top-action-bar">
        <button type="button" class="btn btn-volver" onclick="volverAtras(event)">
          <i class="material-icons">arrow_back</i>
          <span>Volver</span>
        </button>
      </div>

      <!-- Título de la Vista -->
      <h1 class="titulo-principal">VERIFICACIÓN DE ÓRDENES DE COMPRA</h1>

      <!-- PANEL: CRITERIOS DE BÚSQUEDA -->
      <div id="tabContentDatosBasicos" class="tab-pane active">
        <div class="datos-basicos-flex">

          <div class="filter-box filter-box-left" style="flex: 1 1 100%;">
            <span class="box-title-legend">Criterios de Consulta de Órdenes de Compra</span>

            <div class="filter-grid-left">

              <!-- Número de Orden de Compra / Proveedor -->
              <div class="input-group-custom">
                <label for="pOrden" class="input-label-custom">N° Orden / Proveedor</label>
                <input type="text" id="pOrden" class="custom-text-input"
                  placeholder="Ingrese número de orden o proveedor" autocomplete="off">
              </div>

              <!-- Switch: Órdenes de Compra Procesadas -->
              <div class="input-group-custom" style="justify-content: center; padding-top: 10px;">
                <label class="clasif-toggle-wrapper">
                  <input type="checkbox" id="toggleSwitch" checked="false">
                  <span class="onoff-switch"><span class="onoff-slider"></span></span>
                  <span class="toggle-label-text">Órdenes Procesadas</span>
                </label>
              </div>

              <!-- Checkbox: Habilitar Rango de Fechas -->
              <div class="input-group-custom" style="justify-content: center; padding-top: 10px;">
                <label class="clasif-toggle-wrapper">
                  <input type="checkbox" id="chkHabilitarFechas">
                  <span class="onoff-switch"><span class="onoff-slider"></span></span>
                  <span class="toggle-label-text">Filtrar por Rango de Fechas</span>
                </label>
              </div>

              <!-- Fecha Inicial -->
              <div class="input-group-custom">
                <label for="fecha_ini" class="input-label-custom">Fecha Inicial</label>
                <div class="input-with-icon">
                  <input type="text" id="fecha_ini" class="datepicker custom-text-input" placeholder="yyyy-mm-dd"
                    disabled>
                  <i class="material-icons input-calendar-icon">event</i>
                </div>
              </div>

              <!-- Fecha Final -->
              <div class="input-group-custom">
                <label for="fecha_fin" class="input-label-custom">Fecha Final</label>
                <div class="input-with-icon">
                  <input type="text" id="fecha_fin" class="datepicker custom-text-input" placeholder="yyyy-mm-dd"
                    disabled>
                  <i class="material-icons input-calendar-icon">event</i>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>

      <!-- BOTÓN BUSCAR -->
      <div class="search-action-container">
        <button id="btnBuscarOC" class="btn-buscar-gradient" type="button" onclick="ValidaOrdenesDeCompra()">
          <span>Buscar Órdenes</span>
          <i class="material-icons">send</i>
        </button>
      </div>

      <!-- BARRA DE RESULTADOS -->
      <div class="results-control-bar">
        <div id="resultadoGeneral" class="total-registros-title">
          <!-- Inyección dinámica: Total de Registros: X -->
        </div>
      </div>

      <!-- GRID DE RESULTADOS -->
      <div class="grid-table-responsive">
        <table id="tblordendecompra" class="tabla-transacciones">
          <thead>
            <tr>
              <th style="text-align: left;">
                <span class="txt-th-desktop">Núm. Orden / Embarque</span>
                <span class="txt-th-movil">Núm.Orden <br>/Embarque</span>
              </th>
              <th>
                <span class="txt-th-desktop">Destino</span>
                <span class="txt-th-movil">Destino</span>
              </th>
              <th style="text-align: left;">
                <span class="txt-th-desktop">Proveedor</span>
                <span class="txt-th-movil">Proveedor</span>
              </th>
              <th style="text-align: right;">
                <span class="txt-th-desktop">Cant. Sol.</span>
                <span class="txt-th-movil">cant. <br>Pedida <span>
              </th>
              <th style="text-align: right;">
                <span class="txt-th-desktop">Cant. Leida.</span>
                <span class="txt-th-movil">Cant <br>Leida</span>
              </th>
            </tr>
          </thead>
          <tbody>
            <!-- Filas dinámicas inyectadas por verificacionDeOrdenesDeCompra.js -->
          </tbody>
        </table>
      </div>

      <!-- PAGINADOR SELECT -->
      <div id="resultadoPaginador"></div>

    </div>
  </main>

  <!-- FOOTER -->
  <my-footer></my-footer>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="text/javascript" src="js/environment.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/main.js?v=4.3" defer></script>
  <script type="text/javascript" src="js/menu.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/paginacion.js?v=4.2"></script>
  <script type="text/javascript" src="js/loader.js?v=4.2"></script>
  <script type="text/javascript" src="js/footer.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/version-checker.js?v=4.2"></script>
  <script type="text/javascript" src="js/verificacionDeOrdenesDeCompra.js?v=4.2" defer></script>
</body>

</html>
