  <link type="text/css" rel="stylesheet" href="css/main.css?v2.01" media="screen,projection" />
  <link type="text/css" rel="stylesheet" href="css/header.css?v1.01" media="screen,projection" />
  <link type="text/css" rel="stylesheet" href="css/menu.css?v1.01" media="screen,projection" />
  <link type="text/css" rel="stylesheet" href="css/location.css?v1.01" media="screen,projection" />
  <link type="text/css" rel="stylesheet" href="css/buscador.css?v1.01" media="screen,projection" />

  <link type="text/css" rel="stylesheet" href="css/custom.css?v1.01" media="screen,projection" />
  <link type="text/css" rel="stylesheet" href="css/homestyle.css" media="screen,projection" />
  <link type="text/css" rel="stylesheet" href="css/responsiveStyle.css?v1.01" media="screen,projection" />

  <!-- FONTS -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jura&family=Orbitron&family=Oswald&family=Roboto&display=swap');

  <!-- FONTS -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body id="home" tabindex="-1">
  <!-- HEADER -->
  <my-header></my-header>
  <!--HEADER-->
  <main>
    <div id="contenedorLoader"></div>
    <div id="resultadoBusqueda">
      <div id="carga" style="margin-top: -7px;"></div>
      <div class="container">

        <h2 style="text-align:center ; text-transform: uppercase;">Lineas de contenedor</h2>
        <div class="row"><label id="contenedor"></label></div>
        <div class="row"><label id="bodega_solicita"></label></div>
        <!-- Boton Iniciar Despacho -->
        <div class="row col-md-12 S12" id="indespacho-conten-btn">
          <!-- <button id="btniniciardespacho" class="btn-iniciar-despacho" type="submit" onclick="validaInicioConteo()"> 
          Iniciar Despacho
        </button> -->
          <button id="btn-regresar" class="btn-regresar" type="button" onclick="retornarVistaAnterior()">
            Regresar
          </button>
          <!-- INICIO: Switch de lectura por Kits o Cajas -->
          <!-- <div id="switchLecturaContainer" class="row col s12" ">
                    <div class=" switch">
            <label style="font-size: 16px !important;">
              <input type="checkbox" id="toggleSwitchLectura" onchange="toggleSwitchLecturaState(this)">
              <span class="lever"></span>
              Lectura por Kits o Cajas
            </label>
          </div>
        </div> -->
        <!-- FIN: Switch de lectura por Kits o Cajas -->
      </div> 
      <div class="row">
        <ul id="tabs-swipe-demo" class="tabs" style="display: flex; align-items: center;">
          <li class="tab col s4 m3"><a class="active" href="#tabla-lectura" onclick="limpiarMensajes()">LECTURA</a></li>
          <li class="tab col s4 m3"><a href="#tabla-verificacion" onclick="verificacion()">VERIFICACIÓN</a></li>

          <li style="margin-left: auto; padding-right: 15px; display: flex; align-items: center; gap: 16px;">
            <i class="material-icons green-text text-darken-2"
              style="cursor: pointer; font-size: 26px; transition: transform 0.2s;" onclick="window.location.reload();"
              title="Refrescar Pantalla" onmouseover="this.style.transform='scale(1.1)'"
              onmouseout="this.style.transform='scale(1)'">
              refresh
            </i>
            <i class="material-icons blue-text" style="cursor: pointer; font-size: 26px; transition: transform 0.2s;"
              onclick="mostrarInfoColores()" title="Información de procesos"
              onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
              info
            </i>
          </li>
        </ul>
        <div id="tabla-lectura" class="col s12">
          <div class="row">
            <label id="progresoLecturaLabel">
              Progreso: 0/0
            </label>
            <div id="resultadoGeneral"></div>
            <table id="myTableLectura" class="display">
              <!-- Encabezados de la tabla... -->
              <thead>
                <tr class="themeColor">
                  <th style="width: 30%;">Articulo</th>
                  <th id="codigoBarrasHeader" style="width: 30%;">Cod</th>
                  <th style="width: 20%;">Cant</th>
                  <th style="width: 10%;">CL</th>
                </tr>
              </thead>
              <tbody id="tblbodyLectura">
                <tr>
                  <td>
                    <span style="display: inline-block;"></span>
                  </td>
                  <td class="codigo-barras-cell">
                    <input id="codigo-barras" type="text" class="codigo-barras-input" value=""
                      onchange="validarCodigoBarras(this)">
                  </td>
                  <td class="codigo-barras-cell2">
                    <input id="cant-pedida" type="text" class="codigo-barras-input" value=""
                      onchange="validarCantidadPedida(this)">
                  </td>
                  <td class="codigo-barras-cell2">
                    <i class="material-icons red-text" style="cursor: pointer;" onclick="eliminarFila(this)">clear</i>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="row">

          </div>
        </div>
        <div id="tabla-verificacion" class="col s12">
          <label id="cantidadDeRegistros"> Registros:</label>
          <div class="row">
            <div id="resultadoGeneral"></div>
            <table id="myTableVerificacion" class="display centered">
              <thead>
                <tr class="themeColor">
                  <th style="width: 20%;">Articulo</th>
                  <th id="codigoBarrasHeader" style="width: 20%;">Cod</th>
                  <th id="cantidadPedida" style="width: 10%;">Cant<br>Solitud</th>
                  <th id="cantidadLeida" style="width: 10%;">Cant<br>Leida</th>
                  <th id="totalCedi" style="width: 10%;">Total<br> CEDI</th>
                  <th id="verificado" style="width: 10%;">VERIF</th>
                  <th class="width: 10%;" hidden>DEL</th>
                  <!-- <th class="width: 10%;" hidden>DEL</th> -->
                </tr>
              </thead>
              <tbody id="tblbodyLineasContenedor">
                <tr>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    </div>
    <!--Text area para los mensajes-->
    <div id="mensajes" class="container">
      <div class="centered col s12">
        <textarea id="mensajeText"></textarea>
      </div>
    </div>

  </main>

  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="text/javascript" src="js/environment.js?v1.1" defer></script>
  <script type="text/javascript" src="js/main.js?v1.1" defer></script>
  <script type="text/javascript" src="js/menu.js?v1.1" defer></script>
  <script type="text/javascript" src="js/loader.js"></script>
  <script type="text/javascript" src="js/lineasContenedor.js?v1.1" defer></script>

</body>

</html>
