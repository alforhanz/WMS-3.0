<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paquetes de Contenedores Verificados - WMS</title>

  <!-- Fuentes e Íconos -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />

  <!-- Materialize Base + CSS Maestro Unificado -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/main.css?v=4.2" media="screen,projection" />

  <link rel="icon" type="image/x-icon" href="/img/wms.ico" />
  <script src="js/encabezado.js" type="text/javascript"></script>

  <style>
    .observaciones-caja {
      width: 100%;
      min-height: 60px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      color: #1e293b;
      resize: vertical;
      box-sizing: border-box;
      margin-top: 6px;
    }

    .local-search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 4px 12px;
      max-width: 320px;
      margin-left: auto;
    }

    .local-search-input {
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      font-size: 13px !important;
      margin: 0 !important;
      height: 30px !important;
      width: 100% !important;
      background: transparent !important;
    }

    @media screen and (max-width: 768px) {
      .results-control-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .local-search-bar {
        max-width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body id="home" tabindex="-1">
  <!-- HEADER -->
  <my-header></my-header>

  <main>
    <!-- Modal Loader Global -->
    <div id="contenedorLoader"></div>

    <div class="vista-wrapper">

      <!-- Barra Superior de Acciones -->
      <div class="top-action-bar">
        <button type="button" class="btn btn-volver" onclick="window.history.back()">
          <i class="material-icons">arrow_back</i>
          <span>Volver</span>
        </button>
      </div>

      <!-- Título de la Vista -->
      <h1 class="titulo-principal">PAQUETES DE CONTENEDORES VERIFICADOS</h1>

      <!-- PANEL: CRITERIOS DE BÚSQUEDA -->
      <div id="tabContentDatosBasicos" class="tab-pane active">
        <div class="datos-basicos-flex">

          <div class="filter-box filter-box-left" style="flex: 1 1 100%;">
            <span class="box-title-legend">Criterios de Consulta de Paquetes</span>

            <div class="filter-grid-left">

              <!-- Consecutivo del Paquete -->
              <div class="input-group-custom">
                <label for="Aplicacion" class="input-label-custom">Consecutivo del Paquete</label>
                <input type="text" id="Aplicacion" class="custom-text-input" placeholder="Ingrese el consecutivo..." autocomplete="off">
              </div>

              <!-- Bodega de Destino -->
              <div class="input-group-custom">
                <label for="bodegaSelectPack" class="input-label-custom">Bodega de Destino</label>
                <select id="bodegaSelectPack" class="browser-default custom-text-input" style="cursor: pointer;">
                  <option value="" disabled selected>Seleccione una bodega</option>
                </select>
              </div>

              <!-- Fecha Inicial -->
              <div class="input-group-custom">
                <label for="fecha_ini" class="input-label-custom">Fecha Desde</label>
                <div class="input-with-icon">
                  <input type="text" id="fecha_ini" class="datepicker custom-text-input" placeholder="yyyy-mm-dd">
                  <i class="material-icons input-calendar-icon">event</i>
                </div>
              </div>

              <!-- Fecha Final -->
              <div class="input-group-custom">
                <label for="fecha_fin" class="input-label-custom">Fecha Hasta</label>
                <div class="input-with-icon">
                  <input type="text" id="fecha_fin" class="datepicker custom-text-input" placeholder="yyyy-mm-dd">
                  <i class="material-icons input-calendar-icon">event</i>
                </div>
              </div>

              <!-- Switch: Vista Resumida -->
              <div class="input-group-custom" style="justify-content: center; padding-top: 10px;">
                <label class="clasif-toggle-wrapper">
                  <input type="checkbox" id="vistaResumida">
                  <span class="onoff-switch"><span class="onoff-slider"></span></span>
                  <span class="toggle-label-text">Vista Resumida</span>
                </label>
              </div>

            </div>
          </div>

        </div>
      </div>

      <!-- BOTÓN BUSCAR -->
      <div class="search-action-container">
        <button id="verifica-paquetes" class="btn-buscar-gradient" type="button" onclick="cargarParametros()">
          <span>Mostrar Paquetes</span>
          <i class="material-icons">send</i>
        </button>
      </div>

      <!-- BARRA DE RESULTADOS Y FILTRO LOCAL -->
      <div class="results-control-bar" style="margin-top: 5px;">
        <div id="resultadoGeneral" class="total-registros-title">
          <span id="cantidadDeRegistros">Registros: 0</span>
        </div>

        <div class="local-search-bar">
          <i class="material-icons" style="color: #64748b; font-size: 18px;">search</i>
          <input id="txtBuscadorTabla" type="text" class="local-search-input" placeholder="Filtrar resultados..." autocomplete="off">
        </div>
      </div>

      <!-- GRID DE RESULTADOS -->
      <div class="grid-table-responsive">
        <table id="tblResultados" class="tabla-transacciones tabla-compacta-movil">
          <thead>
            <tr>
              <!-- Inyectado dinámicamente -->
            </tr>
          </thead>
          <tbody id="tblbodyResultados">
            <!-- Filas dinámicas -->
          </tbody>
          <tfoot id="tblfootResultados">
            <!-- Totales calculados -->
          </tfoot>
        </table>
      </div>

      <!-- PAGINADOR SELECT -->
      <div id="resultadoPaginador"></div>

      <!-- OBSERVACIONES -->
      <div id="observacion" style="margin-top: 20px;">
        <label for="observaciones" class="input-label-custom">Observaciones</label>
        <textarea id="observaciones" class="observaciones-caja" readonly placeholder="Sin observaciones registradas..."></textarea>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <my-footer></my-footer>

  <!-- Bibliotecas PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="text/javascript" src="js/environment.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/main.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/menu.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/paginacion.js?v=4.2"></script>
  <script type="text/javascript" src="js/loader.js?v=4.2"></script>
  <script type="text/javascript" src="js/footer.js?v=4.2" defer></script>
  <script type="text/javascript" src="js/version-checker.js?v=4.2"></script>

  <script type="text/javascript" src="js/paquetesDeContenedoresVerificados.js?v=4.2" defer></script>
</body>

</html>
